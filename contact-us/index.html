              <circle class="fill-lumi-50" cx="137.28" cy="137.28" r="58.52" />
              <path

              />

          </div>
          <span
            class="font-semibold text-lg tracking-wide text-lumi-400 dark:text-lumi-400"
            >Lumin</span
          >
        </div>
        <div class="hidden md:flex items-center gap-6 text-sm">
          <a href="#features" class="hover:text-lumi-300 transition-colors"
            >Recursos</a
          >
          <a href="#sobre" class="hover:text-lumi-300 transition-colors"
            >Sobre</a
          >
          <a href="#equipe" class="hover:text-lumi-300 transition-colors"
            >Equipe</a
          >
        </div>
        <div class="flex items-center gap-3">
          <button
            id="modeToggle"
            aria-label="Alternar tema"
            class="btn-ghost text-xs"
          >
            <span id="modeLabel">Dark</span>
          </button>
          <a href="/login/">
            <button
              class="cursor-pointer btn-primary text-sm shadow-md shadow-black/40"
            >
              <span>Entrar</span>
            </button>
          </a>
        </div>
      </div>
    </nav>

    <main class="px-4 sm:px-6 pt-24 sm:pt-28 pb-10">
      <section class="max-w-xl mx-auto">
        <div class="lumi-border p-6 sm:p-8 md:p-10">
          <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold">
            Contate-nos
          </h1>
          <p class="mt-3 text-lumi-700 dark:text-lumi-400">
            Comunique-se conosco para dúvidas, sugestões ou feedbacks.
          </p>

          <form
            id="contactForm"
            name="messageForm"
            class="mt-6 space-y-4"
            onsubmit="return false;"
            autocomplete="on"
            novalidate
          >
            <div>
              <label
                for="name"
                class="block text-sm mb-1 text-lumi-700 dark:text-lumi-100"
                >Nome</label
              >
              <input
                id="name"
                name="name"
                type="text"
                class="w-full p-2 rounded-lg border border-lumi-300 dark:border-lumi-600 bg-white/70 dark:bg-lumi-900/30 text-lumi-900 dark:text-lumi-50 outline-none focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500"
                placeholder="Seu nome"
                required
                minlength="2"
              />
              <p
                class="mt-1 text-xs text-red-400 hidden"
                data-error-for="name"
              ></p>
            </div>
            <div>
              <label
                for="email"
                class="block text-sm mb-1 text-lumi-700 dark:text-lumi-100"
                >Email</label
              >
              <input
                id="email"
                name="email"
                type="email"
                class="w-full p-2 rounded-lg border border-lumi-300 dark:border-lumi-600 bg-white/70 dark:bg-lumi-900/30 text-lumi-900 dark:text-lumi-50 outline-none focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500"
                placeholder="Seu e-mail"
                required
              />
              <p
                class="mt-1 text-xs text-red-400 hidden"
                data-error-for="email"
              ></p>
            </div>
            <div>
              <label
                class="block text-sm mb-1 text-lumi-700 dark:text-lumi-100"
                for="message"
                >Mensagem</label
              >
              <textarea
                id="message"
                name="message"
                class="w-full p-2 rounded-lg border border-lumi-300 dark:border-lumi-600 bg-white dark:bg-lumi-900/30 text-lumi-900 dark:text-lumi-50 outline-none focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500 resize-none"
                placeholder="Sua mensagem"
                rows="4"
                maxlength="1000"
                required
                minlength="10"
              ></textarea>
              <p
                class="mt-1 text-xs text-red-400 hidden"
                data-error-for="message"
              ></p>
            </div>
            <div
              id="formStatus"
              role="alert"
              aria-live="polite"
              class="hidden text-sm p-3 rounded-md border border-lumi-300 dark:border-lumi-700"
            ></div>

            <button
              id="submitBtn"
              type="submit"
              class="btn-primary w-full cursor-pointer"
            >
              <span>Enviar</span>
            </button>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="../js/theme-provider.js"></script>
  </body>
</html>
