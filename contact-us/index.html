<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumin | Contato</title>
    <meta name="description" content="Organize, Aprenda & Evolua" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://heikonsilva.github.io/lumin-venturus/"
    />
    <meta property="og:title" content="Lumin" />
    <meta property="og:description" content="Organize, Aprenda & Evolua" />
    <meta property="og:image" content="../assets/meta.png" />
    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://heikonsilva.github.io/lumin-venturus/"
    />
    <meta property="twitter:title" content="Lumin" />
    <meta property="twitter:description" content="Organize, Aprenda & Evolua" />
    <meta property="twitter:image" content="../assets/meta.png" />
    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="../assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/favicon/favicon.svg"
    />
    <link rel="shortcut icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Lumin" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="../style.css" />
    <!-- EmailJS SDK (global) -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
    ></script>
    <script type="module" src="../services/db.js"></script>
    <!-- Contact form handler -->
    <script
      type="module"
      src="../contact-us/functions/contact-form.js"
    ></script>
  </head>
  <body
    class="min-h-screen bg-lumi-100 dark:bg-lumi-950 text-lumi-800 dark:text-lumi-100 selection:bg-lumi-400/30 selection:text-lumi-50 antialiased"
  >
    <nav class="fixed top-4 left-4 right-4 xl:left-16 xl:right-16 z-50">
      <div
        class="lumi-border glass-nav px-4 md:px-6 h-14 flex items-center justify-between"
      >
        <a data-route="/" class="flex items-center gap-3">
          <img src="../assets/lumi.svg" alt="Lumin" class="w-9 h-9" />
          <span
            class="font-semibold text-lg tracking-wide text-lumi-400 dark:text-lumi-400"
            >Lumin</span
          >
        </a>
        <div class="hidden md:flex items-center gap-6 text-sm" id="desktopMenu">
          <a
            data-route="/features/"
            class="hover:text-lumi-300 transition-colors"
            >Produtos</a
          >
          <a
            data-route="/about-us/"
            class="hover:text-lumi-300 transition-colors"
            >Sobre</a
          >
          <a
            data-route="/contact-us/"
            class="hover:text-lumi-300 transition-colors"
            >Contato</a
          >
          <a data-route="/login/" class="btn-ghost">Entrar</a>
          <a data-route="/register/" class="btn-ghost">Cadastrar</a>
          <button
            id="modeToggle"
            aria-label="Alternar tema"
            class="btn-ghost text-xs"
          >
            <span id="modeLabel">Dark</span>
          </button>
        </div>
        <button id="menuToggle" class="btn-ghost md:hidden">Menu</button>
      </div>
      <div
        id="mobileMenu"
        class="hidden md:hidden mt-2 lumi-border p-3 backdrop-blur-3xl"
      >
        <div class="grid gap-2 text-sm">
          <a data-route="/features/" class="hover:text-lumi-300">Produtos</a>
          <a data-route="/about-us/" class="hover:text-lumi-300">Sobre</a>
          <a data-route="/contact-us/" class="hover:text-lumi-300">Contato</a>
          <a data-route="/login/" class="btn-ghost">Entrar</a>
          <a data-route="/register/" class="btn-ghost">Cadastrar</a>
        </div>
      </div>
    </nav>

    <main class="px-4 sm:px-6 pt-24 sm:pt-28 pb-10">
      <section class="max-w-xl mx-auto">
        <div class="lumi-border p-6 sm:p-8 md:p-10">
          <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold">
            Contate-nos
          </h1>
          <p class="mt-3 text-lumi-700 dark:text-lumi-400">
            Comunique-se conosco para dúvidas, sugestões ou feedbacks.
          </p>

          <form
            id="contactForm"
            name="messageForm"
            class="mt-6 space-y-4"
            onsubmit="return false;"
            autocomplete="on"
            novalidate
          >
            <div>
              <label
                for="name"
                class="block text-sm mb-1 text-lumi-700 dark:text-lumi-100"
                >Nome</label
              >
              <input
                id="name"
                name="name"
                type="text"
                class="w-full p-2 rounded-lg border border-lumi-300 dark:border-lumi-600 bg-white/70 dark:bg-lumi-900/30 text-lumi-900 dark:text-lumi-50 outline-none focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500"
                placeholder="Seu nome"
                required
                minlength="2"
              />
              <p
                class="mt-1 text-xs text-red-400 hidden"
                data-error-for="name"
              ></p>
            </div>
            <div>
              <label
                for="email"
                class="block text-sm mb-1 text-lumi-700 dark:text-lumi-100"
                >Email</label
              >
              <input
                id="email"
                name="email"
                type="email"
                class="w-full p-2 rounded-lg border border-lumi-300 dark:border-lumi-600 bg-white/70 dark:bg-lumi-900/30 text-lumi-900 dark:text-lumi-50 outline-none focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500"
                placeholder="Seu e-mail"
                required
              />
              <p
                class="mt-1 text-xs text-red-400 hidden"
                data-error-for="email"
              ></p>
            </div>
            <div>
              <label
                class="block text-sm mb-1 text-lumi-700 dark:text-lumi-100"
                for="message"
                >Mensagem</label
              >
              <textarea
                id="message"
                name="message"
                class="w-full p-2 rounded-lg border border-lumi-300 dark:border-lumi-600 bg-white dark:bg-lumi-900/30 text-lumi-900 dark:text-lumi-50 outline-none focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500 resize-none"
                placeholder="Sua mensagem"
                rows="4"
                maxlength="1000"
                required
                minlength="10"
              ></textarea>
              <p
                class="mt-1 text-xs text-red-400 hidden"
                data-error-for="message"
              ></p>
            </div>
            <div
              id="formStatus"
              role="alert"
              aria-live="polite"
              class="hidden text-sm p-3 rounded-md border border-lumi-300 dark:border-lumi-700"
            ></div>

            <button
              id="submitBtn"
              type="submit"
              class="btn-primary w-full cursor-pointer"
            >
              <span>Enviar</span>
            </button>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="../js/theme-provider.js"></script>
    <script type="module" src="../js/nav.js"></script>
  </body>
</html>
