  <body

      <div class="lumi-border glass-nav p-4 flex items-center gap-3 h-14">

      <nav class="lumi-border p-3 text-sm flex-1 overflow-auto">
        <ul class="grid gap-1">

                width="18"
                height="18"

                />

          </li>
          <li>
            <a
              class="flex items-center gap-3 px-3 py-2 rounded-lg bg-white/5 dark:bg-white/5 hover:bg-white/10"
              href="#"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"

              >
                <path
                  d="M7 3v2m10-2v2M4 8h16M5 20h14a1 1 0 001-1V8H4v11a1 1 0 001 1Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
              </svg>
              <span>Calendário</span>
            </a>
          </li>
          <li>
            <a
              class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/10"
              href="../ai/"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                class="text-lumi-300"
              >
                <path
                  d="M12 3v18m9-9H3"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
              </svg>
              <span>Ações de IA</span>
            </a>
          </li>
        </ul>
      </nav>
      <div class="flex items-center justify-between">
        <button id="modeToggle" class="btn-ghost w-full flex justify-center">
          <span id="modeLabel">Dark</span>
        </button>
      </div>
    </aside>

    <!-- Top Bar -->
    <nav class="fixed left-4 right-4 md:left-72 md:right-72 top-4 z-40">
      <div
        class="lumi-border glass-nav h-14 px-3 sm:px-4 flex items-center gap-3"
      >
        <div class="flex items-center gap-2 flex-1">
          <div class="hidden md:flex items-center gap-2 flex-1">
            <div class="relative flex-1">
              <input
                class="w-full h-10 pl-9 pr-3 rounded-lg bg-white/5 border border-white/10 outline-none text-sm placeholder:text-lumi-500"
                placeholder="Buscar eventos..."
              />
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                class="absolute left-3 top-1/2 -translate-y-1/2 text-lumi-400"
              >
                <path
                  d="m21 21-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
              </svg>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button class="btn-primary hidden sm:inline-flex" id="openEventModal">
            <span>Adicionar Evento</span>
          </button>
          <div
            class="w-8 h-8 rounded-full bg-white/10 border border-white/10"
          ></div>
        </div>
      </div>
    </nav>

    <!-- Right Panel -->
    <aside
      class="hidden xl:flex fixed right-4 top-4 bottom-4 w-72 flex-col gap-3 z-30"
    >
      <div
        class="lumi-border glass-nav h-14 px-4 flex items-center justify-between"
      >
        <span class="text-sm text-lumi-300">Próximos Eventos</span>
        <div
          class="w-6 h-6 rounded-full bg-white/10 border border-white/10"
        ></div>
      </div>
      <div class="lumi-border p-4 overflow-auto">
        <h3 class="text-sm font-semibold text-lumi-200 mb-3">Esta Semana</h3>
        <ul class="grid gap-2 text-xs">
          <li class="p-3 rounded-lg bg-white/5">
            <div class="flex justify-between items-start mb-1">
              <span class="font-medium">Estudo Matemática</span>
              <span
                class="text-[10px] px-1 py-0.5 rounded bg-lumi-400 text-lumi-900"
                >6 Jan</span
              >
            </div>
            <p class="text-lumi-400">10:00 - 12:00</p>
          </li>
          <li class="p-3 rounded-lg bg-white/5">
            <div class="flex justify-between items-start mb-1">
              <span class="font-medium">Deadline report</span>
              <span
                class="text-[10px] px-1 py-0.5 rounded bg-red-500 text-white"
                >9 Jan</span
              >
            </div>
            <p class="text-lumi-400">23:59</p>
          </li>
          <li class="p-3 rounded-lg bg-white/5">
            <div class="flex justify-between items-start mb-1">
              <span class="font-medium">Team meeting</span>
              <span
                class="text-[10px] px-1 py-0.5 rounded bg-orange-500 text-white"
                >15 Jan</span
              >
            </div>
            <p class="text-lumi-400">09:00 - 10:00</p>
          </li>
        </ul>
      </div>
      <div class="lumi-border p-4">
        <h3 class="text-sm font-semibold text-lumi-200 mb-3">Estatísticas</h3>
        <div class="grid gap-2 text-xs">
          <div class="flex justify-between">
            <span class="text-lumi-400">Eventos este mês</span>
            <span class="text-lumi-200 font-medium">12</span>
          </div>
          <div class="flex justify-between">
            <span class="text-lumi-400">Horas de estudo</span>
            <span class="text-lumi-200 font-medium">24h</span>
          </div>
          <div class="flex justify-between">
            <span class="text-lumi-400">Tarefas concluídas</span>
            <span class="text-lumi-200 font-medium">8</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Calendar -->
    <main class="pt-24 px-4 md:pl-72 md:pr-72 xl:pr-[22rem] xl:pl-72 pb-8">
      <header class="mb-6 flex items-center gap-3">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          class="text-lumi-300"
        >
          <path
            d="M7 3v2m10-2v2M4 8h16M5 20h14a1 1 0 001-1V8H4v11a1 1 0 001 1Z"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>
        <h1 class="text-xl font-semibold">Calendário</h1>
      </header>

      <section class="lumi-border p-6">
        <div id="calendar"></div>
      </section>
    </main>

    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>

    <script>
      // Theme management (same as dashboard)
      const root = document.documentElement;
      const toggle = document.getElementById("modeToggle");
      const label = document.getElementById("modeLabel");
      const PREF_KEY = "lumin-theme";
      function applyTheme(theme) {
        if (theme === "dark") root.classList.add("dark");
        else root.classList.remove("dark");
        if (label)
          label.textContent = root.classList.contains("dark")
            ? "Dark"
            : "Light";
      }
      const stored =
        localStorage.getItem(PREF_KEY) ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");
      applyTheme(stored);
      toggle?.addEventListener("click", () => {
        const next = root.classList.contains("dark") ? "light" : "dark";
        localStorage.setItem(PREF_KEY, next);
        applyTheme(next);
      });

      // Initialize FullCalendar
      document.addEventListener("DOMContentLoaded", function () {
        var calendarEl = document.getElementById("calendar");
        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: "dayGridMonth",
          locale: "pt-br",
          headerToolbar: {
            left: "prev,next today",
            center: "title",
            right: "dayGridMonth,timeGridWeek,timeGridDay",
          },
          buttonText: {
            today: "Hoje",
            month: "Mês",
            week: "Semana",
            day: "Dia",
          },
          height: "auto",
          contentHeight: 600,
          aspectRatio: 1.8,
          editable: true,
          selectable: true,
          selectMirror: true,
          dayMaxEvents: true,
          events: [
            {
              title: "Estudo Matemática",
              start: "2025-09-06T10:00:00",
              end: "2025-09-06T12:00:00",
              className: "medium-priority",
              description: "Revisão de funções",
            },
            {
              title: "Review code",
              start: "2025-09-06T14:00:00",
              end: "2025-09-06T15:30:00",
              className: "medium-priority",
            },
            {
              title: "Deadline report",
              start: "2025-09-09T23:59:00",
              className: "high-priority",
              description: "Entrega do relatório final",
            },
            {
              title: "Reunião projeto",
              start: "2025-09-02T14:00:00",
              end: "2025-09-02T15:00:00",
              className: "completed",
              description: "Reunião de alinhamento",
            },
            {
              title: "Apresentação",
              start: "2025-09-12T09:00:00",
              end: "2025-09-12T10:30:00",
              className: "medium-priority",
            },
            {
              title: "Team meeting",
              start: "2025-09-15T09:00:00",
              end: "2025-09-15T10:00:00",
              className: "medium-priority",
            },
            {
              title: "Workshop",
              start: "2025-09-20T14:00:00",
              end: "2025-09-20T17:00:00",
              className: "medium-priority",
            },
            {
              title: "Revisão geral",
              start: "2025-09-23T10:00:00",
              end: "2025-09-23T12:00:00",
              className: "medium-priority",
            },
          ],
          eventClick: function (info) {
            // Handle event click
            alert(
              "Evento: " +
                info.event.title +
                (info.event.extendedProps.description
                  ? "\nDescrição: " + info.event.extendedProps.description
                  : "")
            );
          },
          select: function (info) {
            // Handle date selection
            var title = prompt("Título do evento:");
            if (title) {
              calendar.addEvent({
                title: title,
                start: info.start,
                end: info.end,
                allDay: info.allDay,
              });
            }
            calendar.unselect();
          },
        });

        calendar.render();
      });
    </script>
  </body>
</html>
