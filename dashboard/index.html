    <script type="module">
      import { setupLogout } from './functions/logout.js'
      import { mountUserInfo } from './functions/user-info.js'

      mountUserInfo('userInfo')
      setupLogout('logoutBtn')
      // novo: botão mobile
      setupLogout('logoutBtnMobile')

      import { supabase } from '../services/db.js'
      import {
        createTask,
        getTasks,
        moveTask,
      } from './functions/kanban-tasks.js'

      const columns = [
        { key: 'a-fazer', title: 'A Fazer' },
        { key: 'em-progresso', title: 'Em Progresso' },
        { key: 'concluido', title: 'Concluído' },
      ]

      // Cache de tarefas por coluna para DnD
      const tasksByColumn = {
        'a-fazer': {},
        'em-progresso': {},
        concluido: {},
      }

      // Helpers para atualizar UI imediatamente (optimistic UI)
      const tasksArray = (columnKey) =>
        Object.values(tasksByColumn[columnKey] || {})
      function upsertTaskInColumn(columnKey, task) {
        tasksByColumn[columnKey] ||= {}
        tasksByColumn[columnKey][task.id] = task
        renderColumn(columnKey, tasksArray(columnKey))
      }
      function removeTaskFromColumn(columnKey, id) {
        if (tasksByColumn[columnKey]) delete tasksByColumn[columnKey][id]
        renderColumn(columnKey, tasksArray(columnKey))
      }

      // Preview modal helpers
      const pvOverlay = document.getElementById('modal-preview')
      const pvDialog = document.getElementById('preview-dialog')
      const pvCloseX = document.getElementById('close-preview')
      const pvCloseBtn = document.getElementById('pv-close-btn')
      const pvName = document.getElementById('pv-name')
      const pvType = document.getElementById('pv-type')
      const pvPriority = document.getElementById('pv-priority')
      const pvStart = document.getElementById('pv-start')
      const pvEnd = document.getElementById('pv-end')
      const pvDesc = document.getElementById('pv-description')

      let lastFocused = null

      function formatDate(d) {
        if (!d) return '-'
        try {
          return new Date(d).toLocaleDateString('pt-BR')
        } catch {
          return '-'
        }
      }

      function openPreview(task) {
        if (!(pvOverlay && pvDialog)) return
        lastFocused = document.activeElement

        pvName.textContent = task?.name || task?.title || 'Sem título'
        pvType.textContent = task?.type ? `Tipo: ${task.type}` : 'Tipo: -'
        pvPriority.textContent = `Prioridade: ${task?.priority || '-'}`
        pvStart.textContent = formatDate(task?.start_date)
        pvEnd.textContent = formatDate(task?.end_date)
        pvDesc.textContent = task?.description || 'Sem descrição.'

        pvOverlay.classList.remove('hidden')
        pvOverlay.classList.add('flex')

        // Focus dialog for accessibility
        setTimeout(() => pvDialog.focus(), 0)
      }

      function hidePreview() {
        pvOverlay?.classList.add('hidden')
        pvOverlay?.classList.remove('flex')
        if (lastFocused && typeof lastFocused.focus === 'function') {
          lastFocused.focus()
        }
      }

      // Close interactions
      pvCloseX?.addEventListener('click', hidePreview)
      pvCloseBtn?.addEventListener('click', hidePreview)
      pvOverlay?.addEventListener('click', (e) => {
        if (e.target === pvOverlay) hidePreview()
      })
      document.addEventListener('keydown', (e) => {
        if (!pvOverlay || pvOverlay.classList.contains('hidden')) return
        if (e.key === 'Escape') {
          e.preventDefault()
          hidePreview()
        }
        // Simple focus trap
        if (e.key === 'Tab') {
          const focusables = pvDialog.querySelectorAll(
            'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])',
          )
          if (!focusables.length) return
          const first = focusables[0]
          const last = focusables[focusables.length - 1]
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault()
            last.focus()
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault()
            first.focus()
          }
        }
      })

      // Renderização por coluna
      function renderColumn(columnKey, tasks) {
        const listEl = document.getElementById(`tasks-${columnKey}`)
        const countEl = document.getElementById(`count-${columnKey}`)
        if (!listEl) return
        listEl.innerHTML = ''
        if (countEl) countEl.textContent = tasks.length

        // Atualiza cache
        const map = {}
        tasks.forEach((t) => (map[t.id] = t))
        tasksByColumn[columnKey] = map

        if (tasks.length === 0) {
          const empty = document.createElement('div')
          empty.className = 'text-sm text-lumi-400 px-2 py-4'
          empty.textContent = 'Ainda não foram criadas tarefas.'
          listEl.appendChild(empty)
          return
        }

        tasks.forEach((task) => {
          const article = document.createElement('article')
          article.className =
            'lumi-border p-6 bg-white/5 dark:bg-white/5 rounded-xl grid gap-3'
          article.setAttribute('draggable', 'true')
          article.dataset.id = task.id
          article.dataset.from = columnKey
          const due = task.end_date
            ? new Date(task.end_date).toLocaleDateString('pt-BR')
            : ''
          article.innerHTML = `
            <h3 class="font-medium">${task.name || task.title}</h3>
            <div class="flex flex-wrap gap-1 text-[11px]">
              <span class="px-1.5 py-0.5 rounded bg-white/10">${
                task.priority || 'Normal'
              }</span>
              ${
                task.type
                  ? `<span class="px-1.5 py-0.5 rounded bg-white/5">${task.type}</span>`
                  : ''
              }
            </div>
            <div class="flex items-center justify-between text-xs text-lumi-400">
              <span>${due}</span>
              <span class="text-[10px] opacity-70">Clique para ver</span>
            </div>
          `
          // Preview on click
          article.addEventListener('click', () => openPreview(task))
          // DnD handlers
          article.addEventListener('dragstart', (e) => {
            try {
              e.dataTransfer.setData(
                'text/plain',
                JSON.stringify({ id: task.id, from: columnKey }),
              )
            } catch {}
            e.dataTransfer.effectAllowed = 'move'
            article.classList.add('opacity-60')
          })
          article.addEventListener('dragend', () => {
            article.classList.remove('opacity-60')
          })
          listEl.appendChild(article)
        })
      }

      let currentUser = null
      let targetColumnForModal = 'a-fazer'

      function initForUser(user) {
        currentUser = user
        if (!user) return // auth-handler cuidará do redirect

        // Inicializa listeners de cada coluna
        columns.forEach(({ key }) => {
          const listEl = document.getElementById(`tasks-${key}`)
          if (listEl) {
            listEl.innerHTML = `<div class="flex justify-center py-6" data-spinner>\n  <svg class="animate-spin h-6 w-6 text-lumi-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">\n    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>\n    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>\n  </svg>\n</div>`
          }
          getTasks(user.id, key, (tasks) => {
            // Atualiza cache e renderiza
            renderColumn(key, tasks)
          })
        })
      }

      // Sessão inicial
      supabase.auth.getSession().then(({ data }) => {
        const user = data.session?.user || null
        initForUser(user)
      })
      // Mudanças futuras
      supabase.auth.onAuthStateChange((_event, session) => {
        const user = session?.user || null
        initForUser(user)
      })

      // Modal wiring
      document.addEventListener('DOMContentLoaded', () => {
        const addButton = document.getElementById('open-modal-task')
        const modal = document.getElementById('modal-task')
        const closeModal = document.getElementById('close-modal')
        const form = document.getElementById('form-task')
        const otherAddButtons = document.querySelectorAll(
          '[data-open-modal-column]',
        )

        function openModal(columnKey) {
          targetColumnForModal = columnKey
          modal.classList.remove('hidden')
          modal.classList.add('flex')
        }
        function hideModal() {
          modal.classList.add('hidden')
          modal.classList.remove('flex')
        }

        addButton?.addEventListener('click', () => openModal('a-fazer'))
        otherAddButtons.forEach((btn) => {
          btn.addEventListener('click', () =>
            openModal(btn.getAttribute('data-open-modal-column')),
          )
        })
        closeModal?.addEventListener('click', hideModal)

        form?.addEventListener('submit', async (e) => {
          e.preventDefault()
          if (!currentUser) return
          const data = Object.fromEntries(new FormData(form))
          const payload = {
            name: data.name,
            description: data.description,
            type: data.type,
            priority: data.priority,
            start_date: data.start_date
              ? new Date(data.start_date).toISOString()
              : null,
            end_date: data.end_date
              ? new Date(data.end_date).toISOString()
              : null,
          }
          try {
            // Cria no banco e usa o retorno para atualizar a UI imediatamente
            const created = await createTask(
              currentUser.id,
              targetColumnForModal,
              payload,
            )
            upsertTaskInColumn(targetColumnForModal, created)
          } catch (err) {
            console.error('Falha ao criar tarefa:', err)
            alert('Não foi possível criar a tarefa agora.')
          } finally {
            form.reset()
            hideModal()
          }
        })

        // Drag & Drop: configura zonas de drop nas colunas
        function setupDnD() {
          columns.forEach(({ key }) => {
            const zone = document.getElementById(`tasks-${key}`)
            if (!zone) return
            const addHighlight = () =>
              zone.classList.add('outline', 'outline-2', 'outline-lumi-400/50')
            const removeHighlight = () =>
              zone.classList.remove(
                'outline',
                'outline-2',
                'outline-lumi-400/50',
              )
            zone.addEventListener('dragover', (e) => {
              e.preventDefault()
              addHighlight()
              e.dataTransfer.dropEffect = 'move'
            })
            zone.addEventListener('dragleave', () => {
              removeHighlight()
            })
            zone.addEventListener('drop', async (e) => {
              e.preventDefault()
              removeHighlight()
              let payload = null
              try {
                payload = JSON.parse(e.dataTransfer.getData('text/plain'))
              } catch {}
              if (!payload) return
              const { id, from } = payload
              const to = key
              if (!(id && from && currentUser) || from === to) return
              const task = tasksByColumn[from]?.[id]
              if (!task) return

              // Optimistic UI: move imediatamente
              const originalFrom = from
              const originalTask = { ...task }
              try {
                removeTaskFromColumn(originalFrom, id)
                const updated = { ...task, status: to }
                upsertTaskInColumn(to, updated)
                await moveTask(currentUser.id, originalFrom, to, task)
              } catch (err) {
                // Rollback visual se falhar
                console.error('Falha ao mover tarefa:', err)
                removeTaskFromColumn(to, id)
                upsertTaskInColumn(originalFrom, originalTask)
                alert('Não foi possível mover a tarefa.')
              }
            })
          })
        }
        setupDnD()
      })
    </script>
  </body>
</html>
