    <!-- Main Calendar -->
    <main
      class="px-4 pt-8 pb-28 md:pr-72 md:pb-8 md:pl-72 xl:pr-[22rem] xl:pl-72"
    >
      <header class="mb-6 flex items-center gap-3">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          class="text-lumi-300"
        >
          <path
            d="M7 3v2m10-2v2M4 8h16M5 20h14a1 1 0 001-1V8H4v11a1 1 0 001 1Z"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>
        <h1 class="text-xl font-semibold">Calendário</h1>
      </header>

      <section class="lumi-border p-6">
        <div id="calendar"></div>
      </section>
    </main>

    <!-- Mobile bottom nav -->
    <nav
      class="fixed right-4 bottom-4 left-4 z-50 md:hidden"
      role="navigation"
      aria-label="Navegação móvel"
    >
      <div
        class="lumi-border glass-nav flex h-14 items-center justify-between gap-1 rounded-xl bg-white/5 px-2 dark:bg-white/5"
      >
        <a
          data-route="/dashboard/"
          class="text-lumi-300 flex h-12 flex-1 flex-col items-center justify-center gap-0.5 rounded-lg text-xs font-medium hover:bg-white/10"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            class="text-lumi-300"
          >
            <path
              d="M4 7h5v5H4V7Zm0 7h5v5H4v-5Zm7-7h9v5h-9V7Zm0 7h9v5h-9v-5Z"
              stroke="currentColor"
              stroke-width="1.5"
            />
          </svg>
          <span>Kanban</span>
        </a>
        <a
          data-route="/dashboard/calendar/"
          aria-current="page"
          class="text-lumi-200 flex h-12 flex-1 flex-col items-center justify-center gap-0.5 rounded-lg bg-white/5 text-xs font-medium"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            class="text-lumi-300"
          >
            <path
              d="M7 3v2m10-2v2M4 8h16M5 20h14a1 1 0 001-1V8H4v11a1 1 0 001 1Z"
              stroke="currentColor"
              stroke-width="1.5"
            />
          </svg>
          <span>Calendário</span>
        </a>
        <a
          data-route="/dashboard/ai/"
          class="text-lumi-300 flex h-12 flex-1 flex-col items-center justify-center gap-0.5 rounded-lg text-xs font-medium hover:bg-white/10"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            class="text-lumi-300"
          >
            <path d="M12 3v18m9-9H3" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <span>Ações de IA</span>
        </a>
        <!-- Botão Sair -->
        <button
          id="logoutBtnMobile"
          type="button"
          class="text-lumi-300 flex h-12 flex-1 flex-col items-center justify-center gap-0.5 rounded-lg text-xs font-medium hover:bg-white/10"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            class="text-lumi-300"
            aria-hidden="true"
          >
            <path
              d="M14.5 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path d="M10 16l4-4-4-4" stroke="currentColor" stroke-width="1.5" />
            <path d="M14 12H3" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <span>Sair</span>
        </button>
      </div>
    </nav>

    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>

    <script type="module" src="../../js/theme-provider.js"></script>
    <script type="module" src="../../js/nav.js"></script>
    <script type="module">
      import { setupLogout } from '../functions/logout.js'
      import { mountUserInfo } from '../functions/user-info.js'

      mountUserInfo('userInfo')
      setupLogout('logoutBtn')
      // novo: botão mobile
      setupLogout('logoutBtnMobile')

      import { initCalendar } from '../functions/calendar.js'

      document.addEventListener('DOMContentLoaded', () => {
        const el = document.getElementById('calendar')
        if (el) initCalendar(el)
      })
    </script>
  </body>
