<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumin | Contato</title>
    <meta name="description" content="Organize, Aprenda & Evolua" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://heikonsilva.github.io/lumin-venturus/"
    />
    <meta property="og:title" content="Lumin" />
    <meta property="og:description" content="Organize, Aprenda & Evolua" />
    <meta property="og:image" content="../assets/meta.png" />
    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://heikonsilva.github.io/lumin-venturus/"
    />
    <meta property="twitter:title" content="Lumin" />
    <meta property="twitter:description" content="Organize, Aprenda & Evolua" />
    <meta property="twitter:image" content="../assets/meta.png" />
    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="../assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/favicon/favicon.svg"
    />
    <link rel="shortcut icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Lumin" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
    <link rel="stylesheet" href="../style.css" />
    <script
      type="module"
      src="../contact-us/functions/contact-form.js"
    ></script>
  </head>
  <body>
    <nav class="fixed top-4 right-4 left-4 z-50 xl:right-16 xl:left-16">
      <div
        class="lumi-border glass-nav flex h-14 items-center justify-between px-4 md:px-6"
      >
        <a href="../" class="flex items-center gap-3">
          <img src="../assets/lumi.svg" alt="Lumin" class="h-9 w-9" />
          <span class="text-lg font-semibold tracking-wide">Lumin</span>
        </a>
        <div class="hidden items-center gap-6 text-sm md:flex" id="desktopMenu">
          <a href="../features/" class="hover:text-lumi-300 transition-colors"
            >Produtos</a
          >
          <a href="../about-us/" class="hover:text-lumi-300 transition-colors"
            >Sobre</a
          >
          <a href="../contact-us/" class="hover:text-lumi-300 transition-colors"
            >Contato</a
          >
          <a href="../login/" class="btn-ghost">Entrar</a>
          <a href="../register/" class="btn-ghost">Cadastrar</a>
        </div>
        <button id="menuToggle" class="btn-ghost md:hidden">Menu</button>
      </div>
      <div
        id="mobileMenu"
        class="lumi-border mt-2 hidden p-3 backdrop-blur-3xl md:hidden"
      >
        <div class="grid gap-2 text-sm">
          <a href="../features/" class="hover:text-lumi-300">Produtos</a>
          <a href="../about-us/" class="hover:text-lumi-300">Sobre</a>
          <a href="../contact-us/" class="hover:text-lumi-300">Contato</a>
          <a href="../login/" class="btn-ghost">Entrar</a>
          <a href="../register/" class="btn-ghost">Cadastrar</a>
        </div>
      </div>
    </nav>

    <main class="px-4 pt-24 pb-10 sm:px-6 sm:pt-28">
      <section class="mx-auto max-w-xl">
        <div class="lumi-border p-6 sm:p-8 md:p-10">
          <h1 class="text-lumi-200 text-2xl font-bold sm:text-3xl md:text-4xl">
            Contate-nos
          </h1>
          <p class="mt-3">
            Comunique-se conosco para dúvidas, sugestões ou feedbacks.
          </p>

          <form
            id="contactForm"
            name="messageForm"
            class="mt-6 space-y-4"
            onsubmit="return false;"
            autocomplete="on"
            novalidate
          >
            <div>
              <label for="name" class="mb-1 block text-sm">Nome</label>
              <input
                id="name"
                name="name"
                type="text"
                class="border-lumi-300 dark:border-lumi-600 dark:bg-lumi-900/30 focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500 w-full rounded-lg border bg-white/70 p-2 outline-none"
                placeholder="Seu nome"
                required
                minlength="2"
              />
              <p
                class="mt-1 hidden text-xs text-red-400"
                data-error-for="name"
              ></p>
            </div>
            <div>
              <label for="email" class="mb-1 block text-sm">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                class="border-lumi-300 dark:border-lumi-600 dark:bg-lumi-900/30 focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500 w-full rounded-lg border bg-white/70 p-2 outline-none"
                placeholder="Seu e-mail"
                required
              />
              <p
                class="mt-1 hidden text-xs text-red-400"
                data-error-for="email"
              ></p>
            </div>
            <div>
              <label class="mb-1 block text-sm" for="message">Mensagem</label>
              <textarea
                id="message"
                name="message"
                class="border-lumi-300 dark:border-lumi-600 dark:bg-lumi-900/30 focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500 w-full resize-none rounded-lg border bg-white p-2 outline-none"
                placeholder="Sua mensagem"
                rows="4"
                maxlength="1000"
                required
                minlength="10"
              ></textarea>
              <p
                class="mt-1 hidden text-xs text-red-400"
                data-error-for="message"
              ></p>
            </div>
            <div
              id="formStatus"
              role="alert"
              aria-live="polite"
              class="border-lumi-300 dark:border-lumi-700 hidden rounded-md border p-3 text-sm"
            ></div>

            <button
              id="submitBtn"
              type="submit"
              class="btn-primary w-full cursor-pointer"
            >
              <span>Enviar</span>
            </button>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="../js/theme-provider.js"></script>
    <script type="module" src="../js/nav.js"></script>
  </body>
</html>
