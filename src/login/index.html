<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumin | Login</title>
    <meta name="description" content="Organize, Aprenda & Evolua" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://heikonsilva.github.io/lumin-venturus/"
    />
    <meta property="og:title" content="Lumin" />
    <meta property="og:description" content="Organize, Aprenda & Evolua" />
    <meta property="og:image" content="../assets/meta.png" />
    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://heikonsilva.github.io/lumin-venturus/"
    />
    <meta property="twitter:title" content="Lumin" />
    <meta property="twitter:description" content="Organize, Aprenda & Evolua" />
    <meta property="twitter:image" content="../assets/meta.png" />
    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="../assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/favicon/favicon.svg"
    />
    <link rel="shortcut icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Lumin" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="../services/supabase.js"></script>
    <script type="module" src="../js/auth-handler.js"></script>
    <script type="module" src="../login/functions/login-anonymus.js"></script>
    <script
      type="module"
      src="../login/functions/login-with-google.js"
    ></script>
    <script
      type="module"
      src="../login/functions/login-with-password.js"
    ></script>
  </head>
  <body>
    <main
      class="flex min-h-screen items-center justify-center px-4 py-16 sm:px-6"
    >
      <section class="flex w-full max-w-xl flex-col items-center">
        <a href="../" class="text-lumi-400 mb-6 flex items-center gap-3">
          <img src="../assets/lumi.svg" alt="Lumin" class="h-12 w-12" />
          <span class="text-2xl font-semibold">Lumin</span>
        </a>
        <div class="lumi-border w-full p-6 sm:p-8 md:p-10">
          <h1 class="text-lumi-200 text-2xl font-bold sm:text-3xl md:text-4xl">
            Entrar
          </h1>
          <p class="text-lumi-700 dark:text-lumi-400 mt-3">
            Acesse sua conta para continuar organizando e evoluindo.
          </p>

          <form
            name="loginForm"
            class="mt-6 space-y-4"
            onsubmit="return false;"
            autocomplete="on"
          >
            <div>
              <label
                for="email"
                class="text-lumi-700 dark:text-lumi-300 mb-1 block text-sm"
              >
                Email
              </label>
              <input
                id="email"
                type="email"
                class="border-lumi-300 dark:border-lumi-600 dark:bg-lumi-900/30 text-lumi-900 dark:text-lumi-50 focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500 w-full rounded-lg border bg-white/70 p-2 outline-none"
                placeholder="Seu Email"
                name="email"
                required
              />
            </div>
            <div>
              <label
                class="text-lumi-700 dark:text-lumi-300 mb-1 block text-sm"
                for="password"
              >
                Senha
              </label>
              <input
                id="password"
                type="password"
                class="border-lumi-300 dark:border-lumi-600 dark:bg-lumi-900/30 text-lumi-900 dark:text-lumi-50 focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500 w-full rounded-lg border bg-white p-2 outline-none"
                placeholder="Crie uma senha"
                name="password"
                required
                minlength="6"
              />
              <div class="mt-2 text-right">
                <button
                  id="forgotPwd"
                  class="hover:text-lumi-300 text-sm underline"
                >
                  Esqueci minha senha
                </button>
              </div>
              <p
                id="loginError"
                role="alert"
                aria-live="polite"
                class="mt-2 hidden text-sm text-red-400"
              ></p>
            </div>
            <button type="submit" class="btn-primary w-full">
              <span>Entrar</span>
            </button>
          </form>

          <div class="mt-6 flex items-center gap-3">
            <div class="bg-lumi-700/40 h-px flex-1 dark:bg-white/10"></div>
            <span class="text-lumi-600 dark:text-lumi-400 text-xs">ou</span>
            <div class="bg-lumi-700/40 h-px flex-1 dark:bg-white/10"></div>
          </div>

          <div class="mt-4 flex justify-center gap-2">
            <button
              id="login-google"
              aria-label="Entrar com Google"
              class="btn-social h-11 w-11"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 48 48"
                class="h-5 w-5"
              >
                <path
                  fill="#FFC107"
                  d="M43.611 20.083H42V20H24v8h11.303C33.731 32.91 29.267 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.156 7.961 3.039l5.657-5.657C34.869 6.053 29.706 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.651-.389-3.917z"
                />
                <path
                  fill="#FF3D00"
                  d="M6.306 14.691l6.571 4.817C14.655 16.265 18.961 14 24 14c3.059 0 5.842 1.156 7.961 3.039l5.657-5.657C34.869 6.053 29.706 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"
                />
                <path
                  fill="#4CAF50"
                  d="M24 44c5.207 0 9.9-1.99 13.426-5.228l-6.197-5.238C29.143 35.091 26.715 36 24 36c-5.243 0-9.718-3.106-11.289-7.436l-6.54 5.036C9.49 39.556 16.227 44 24 44z"
                />
                <path
                  fill="#1976D2"
                  d="M43.611 20.083H42V20H24v8h11.303c-1.009 2.823-2.941 5.176-5.497 6.881.002-.001.003-.002.005-.004l6.197 5.238C34.054 42.115 38.5 44 44 44c0-6.627 0-13.255 0-20 0-1.341-.138-2.651-.389-3.917z"
                />
              </svg>
            </button>
            <button
              id="login-guest"
              aria-label="Entrar como convidado"
              class="btn-social h-11 w-32"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
                />
              </svg>
              <span>Convidado</span>
            </button>
          </div>
          <p class="text-lumi-700 dark:text-lumi-400 mt-6 text-center text-sm">
            Não tem conta?
            <a class="hover:text-lumi-300 underline" href="../register/"
              >Crie uma agora</a
            >
          </p>
        </div>
      </section>
    </main>

    <script type="module" src="../js/theme-provider.js"></script>
    <script type="module" src="./functions/reset-password.js"></script>
    <script type="module">
      import { setupResetPassword } from './functions/reset-password.js'

      setupResetPassword()
    </script>
  </body>
</html>
