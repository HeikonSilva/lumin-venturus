<!-- Lumin Email Template -->
<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="background-color: #f4f8fb; margin: 0; padding: 24px 0"
>
  <tr>
    <td align="center" style="padding: 0 16px">
      <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="max-width: 600px; width: 100%"
      >
        <!-- Header -->
        <tr>
          <td style="padding: 16px 20px 8px 20px; text-align: left">
            <table
              role="presentation"
              cellpadding="0"
              cellspacing="0"
              style="border-collapse: collapse"
            >
              <tr>
                <td style="padding: 0 10px 0 0; vertical-align: middle">
                  <img
                    src="https://heikonsilva.github.io/lumin-venturus/assets/favicon/favicon.svg"
                    width="28"
                    height="28"
                    alt="Lumin"
                    style="
                      display: block;
                      border: 0;
                      outline: none;
                      text-decoration: none;
                    "
                  />
                </td>
                <td style="vertical-align: middle">
                  <div
                    style="
                      font-family:
                        system-ui,
                        -apple-system,
                        Segoe UI,
                        Roboto,
                        Arial,
                        sans-serif;
                      font-size: 12px;
                      color: #5b778a;
                    "
                  >
                    Notificação Lumin
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Card -->
        <tr>
          <td style="padding: 0 0">
            <table
              role="presentation"
              width="100%"
              cellpadding="0"
              cellspacing="0"
              style="
                background: #ffffff;
                border: 1px solid #e3edf3;
                border-radius: 14px;
                overflow: hidden;
              "
            >
              <!-- Top bar accent -->
              <tr>
                <td style="height: 4px; background: #7faec6"></td>
              </tr>

              <!-- Intro -->
              <tr>
                <td
                  style="
                    padding: 20px;
                    font-family:
                      system-ui,
                      -apple-system,
                      Segoe UI,
                      Roboto,
                      Arial,
                      sans-serif;
                    color: #0e2a3a;
                    font-size: 14px;
                    line-height: 1.5;
                  "
                >
                  Uma mensagem de
                  <strong style="color: #0e2a3a">{{name}}</strong> foi recebida.
                  Responda quando possível.
                </td>
              </tr>

              <!-- Message block -->
              <tr>
                <td style="padding: 0 20px 20px 20px">
                  <table
                    role="presentation"
                    cellpadding="0"
                    cellspacing="0"
                    style="width: 100%"
                  >
                    <tr>
                      <!-- Avatar -->
                      <td style="vertical-align: top; width: 56px">
                        <div
                          role="img"
                          aria-label="Usuário"
                          style="
                            padding: 8px 10px;
                            margin-right: 12px;
                            background-color: #eaf4fa;
                            border-radius: 8px;
                            font-size: 24px;
                            text-align: center;
                          "
                        >
                          👤
                        </div>
                      </td>

                      <!-- Content -->
                      <td style="vertical-align: top">
                        <div
                          style="
                            font-family:
                              system-ui,
                              -apple-system,
                              Segoe UI,
                              Roboto,
                              Arial,
                              sans-serif;
                          "
                        >
                          <div
                            style="
                              color: #0e2a3a;
                              font-size: 16px;
                              font-weight: 600;
                              line-height: 1.2;
                              margin-bottom: 2px;
                            "
                          >
                            {{name}}
                          </div>

                          <div
                            style="
                              color: #7c93a4;
                              font-size: 12px;
                              margin-bottom: 10px;
                            "
                          >
                            {{time}}
                          </div>

                          <div
                            style="
                              font-size: 15px;
                              color: #143546;
                              line-height: 1.6;
                            "
                          >
                            {{message}}
                          </div>
                        </div>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- Divider -->
              <!-- <tr>
                <td style="padding: 0 20px 16px 20px">
                  <div style="height: 1px; background: #eef5f9"></div>
                </td>
              </tr> -->

              <!-- Footer/help -->
              <!-- <tr>
                <td
                  style="
                    padding: 0 20px 20px 20px;
                    font-family: system-ui, -apple-system, Segoe UI, Roboto,
                      Arial, sans-serif;
                    font-size: 12px;
                    color: #5b778a;
                    line-height: 1.4;
                  "
                >
                  Se você não esperava este e‑mail, ignore-o com segurança.
                </td>
              </tr> -->
            </table>
          </td>
        </tr>

        <!-- Signature -->
        <tr>
          <td style="padding: 12px 20px 0 20px; text-align: left">
            <div
              style="
                font-family:
                  system-ui,
                  -apple-system,
                  Segoe UI,
                  Roboto,
                  Arial,
                  sans-serif;
                font-size: 12px;
                color: #7c93a4;
              "
            >
              Lumin
            </div>
          </td>
        </tr>
        <tr>
          <td style="height: 12px"></td>
        </tr>
      </table>
    </td>
  </tr>
</table>
