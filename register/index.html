<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <style type="text/tailwindcss">
      @theme {
        --color-coffee-50: oklch(0.985 0.008 70);
        --color-coffee-100: oklch(0.945 0.015 70);
        --color-coffee-200: oklch(0.875 0.02 70);
        --color-coffee-300: oklch(0.775 0.03 60);
        --color-coffee-400: oklch(0.675 0.04 50);
        --color-coffee-500: oklch(0.575 0.045 50);
        --color-coffee-600: oklch(0.475 0.045 50);
        --color-coffee-700: oklch(0.375 0.04 50);
        --color-coffee-800: oklch(0.275 0.03 40);
        --color-coffee-900: oklch(0.2 0.025 40);
        --color-coffee-950: oklch(0.14 0.02 40);
      }
    </style>

    <style type="text/css">
      :root {
        --color-coffee-50: oklch(0.985 0.008 70);
        --color-coffee-100: oklch(0.945 0.015 70);
        --color-coffee-200: oklch(0.875 0.02 70);
        --color-coffee-300: oklch(0.775 0.03 60);
        --color-coffee-400: oklch(0.675 0.04 50);
        --color-coffee-500: oklch(0.575 0.045 50);
        --color-coffee-600: oklch(0.475 0.045 50);
        --color-coffee-700: oklch(0.375 0.04 50);
        --color-coffee-800: oklch(0.275 0.03 40);
        --color-coffee-900: oklch(0.2 0.025 40);
        --color-coffee-950: oklch(0.14 0.02 40);
        --radius-base: 18px;
      }

      /* Apple‑like luminous / glass border utility */
      .lumi-border {
        position: relative;
        border-radius: var(--radius-base);
        background: linear-gradient(
          145deg,
          color-mix(in oklab, var(--color-coffee-800) 96%, black 5%) 0%,
          var(--color-coffee-900) 100%
        );
        border: 1px solid
          color-mix(in oklab, var(--color-coffee-300) 40%, transparent);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset,
          0 0 12px -2px rgba(255, 255, 255, 0.08),
          0 8px 24px -4px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      .lumi-border:before {
        /* glow ring */
        content: "";
        position: absolute;
        inset: 0;
        padding: 1px;
        border-radius: inherit;
        background: radial-gradient(
            circle at 20% 15%,
            rgba(255, 255, 255, 0.18),
            transparent 60%
          ),
          linear-gradient(
            120deg,
            rgba(255, 255, 255, 0.25),
            rgba(255, 255, 255, 0) 60%
          ),
          linear-gradient(
            160deg,
            rgba(203, 170, 150, 0.35),
            rgba(203, 170, 150, 0) 70%
          );
        -webkit-mask: linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        mix-blend-mode: plus-lighter;
      }
      .lumi-border[data-variant="light"] {
        background: linear-gradient(
          140deg,
          var(--color-coffee-100),
          var(--color-coffee-200)
        );
        border-color: rgba(0, 0, 0, 0.08);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.5) inset,
          0 8px 16px -6px rgba(120, 80, 50, 0.25);
      }
      html:not(.dark) .lumi-border:not([data-variant="dark"]) {
        background: linear-gradient(
          145deg,
          var(--color-coffee-50),
          var(--color-coffee-100)
        );
        border-color: color-mix(
          in oklab,
          var(--color-coffee-400) 35%,
          transparent
        );
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.04) inset,
          0 4px 14px -4px rgba(120, 80, 50, 0.18),
          0 0 24px -6px rgba(160, 120, 90, 0.25);
      }
      html:not(.dark) .lumi-border:not([data-variant="dark"]):before {
        background: radial-gradient(
            circle at 25% 20%,
            rgba(160, 120, 90, 0.35),
            transparent 60%
          ),
          linear-gradient(
            120deg,
            rgba(255, 255, 255, 0.65),
            rgba(255, 255, 255, 0) 60%
          ),
          linear-gradient(
            160deg,
            rgba(200, 170, 150, 0.55),
            rgba(200, 170, 150, 0) 70%
          );
        mix-blend-mode: normal;
      }
      .lumi-border:hover {
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06) inset,
          0 0 0 1px rgba(255, 255, 255, 0.05),
          0 8px 28px -6px rgba(0, 0, 0, 0.6);
      }
      html:not(.dark) .lumi-border:hover {
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05) inset,
          0 0 0 1px rgba(0, 0, 0, 0.03), 0 6px 20px -4px rgba(120, 80, 50, 0.25);
      }

      .btn-primary {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        border-radius: var(--radius-base);
        overflow: hidden;
        color: var(--color-coffee-50);
        font-size: 0.95rem;
      }
      .btn-primary:before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          var(--color-coffee-500),
          var(--color-coffee-600)
        );
        opacity: 0.9;
      }
      .btn-primary:after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 30% 20%,
          rgba(255, 255, 255, 0.35),
          transparent 60%
        );
        mix-blend-mode: overlay;
      }
      .btn-primary span {
        position: relative;
        z-index: 10;
      }
      .btn-primary:hover:before {
        filter: brightness(1.05);
      }
      .btn-primary:active:before {
        filter: brightness(0.9);
      }
    </style>
</head>
<body class="min-h-screen bg-coffee-100 dark:bg-coffee-800 text-coffee-800 dark:text-coffee-100 selection:bg-coffee-400/30 selection:text-coffee-50 antialiased text-center flex items-center justify-center">
    <div class="w-125 h-150 p-8 flex items-center justify-center bg-coffee-700 rounded-xl">
      <form class="w-full" action="">
        <h1 class="text-5xl font-bold">Cadastro</h1>

        <div class="flex flex-col text-start w-full mt-8 p-6">
          <span class="text-2xl">Usuário</span>
          <input type="text" class="w-full mb-4 p-2 rounded-lg border border-coffee-300 bg-coffee-50 text-coffee-800 mt-2"/>

          <span class="text-2xl">E-mail</span>
          <input type="email" class="w-full mb-4 p-2 rounded-lg border border-coffee-300 bg-coffee-50 text-coffee-800 mt-2"/>

          <span class="text-2xl">Senha</span>
          <input type="password" class="w-full mb-4 p-2 rounded-lg border border-coffee-300 bg-coffee-50 text-coffee-800 mt-2"/>

          <input type="submit" value="Cadastrar" class="w-full mt-5 p-2 rounded-lg border border-coffee-800 bg-coffee-500 text-coffee-50 cursor-pointer hover:bg-coffee-600 transition-colors"/>
        </div>
      </form>
    </div>
</body>
</html>
