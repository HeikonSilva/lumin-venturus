<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumin — Cadastro</title>
    <meta name="description" content="Crie sua conta no Lumin" />
    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="../assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/favicon/favicon.svg"
    />
    <link rel="shortcut icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Lumin" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="../services/firebase.js"></script>
    <script type="module" src="../js/auth-handler.js"></script>
    <script type="module" src="./functions/register.js"></script>
  </head>
  <body
    class="min-h-screen bg-lumi-100 dark:bg-lumi-950 text-lumi-800 dark:text-lumi-100 selection:bg-lumi-400/30 selection:text-lumi-50 antialiased"
  >
    <nav class="fixed top-4 left-4 right-4 max-w-3xl mx-auto z-50">
      <div
        class="lumi-border glass-nav flex items-center justify-between px-4 h-12"
      >
        <a href="../" class="flex items-center gap-2">
          <img src="../assets/lumi.svg" alt="Lumin" class="w-7 h-7" />
          <span class="font-semibold text-lumi-400">Lumin</span>
        </a>
        <div class="flex items-center gap-2">
          <a href="../login/" class="btn-ghost">Entrar</a>
          <button id="modeToggle" aria-label="Alternar tema" class="btn-ghost">
            <span id="modeLabel">Dark</span>
          </button>
        </div>
      </div>
    </nav>

    <main class="px-4 sm:px-6 pt-24 sm:pt-28 pb-10">
      <section class="max-w-xl sm:max-w-3xl mx-auto">
        <div
          class="lumi-border p-6 sm:p-8 md:p-10 grid gap-6 md:grid-cols-2 items-start"
        >
          <div>
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold">
              Crie sua conta
            </h1>
            <p class="mt-3 text-lumi-700 dark:text-lumi-400">
              Comece a usar o Lumin para organizar seus estudos.
            </p>
          </div>

          <form
            name="registerForm"
            class="space-y-4 text-left"
            onsubmit="return false;"
            autocomplete="on"
          >
            <div>
              <label
                class="block text-sm mb-1 text-lumi-700 dark:text-lumi-300"
                for="email"
                >E-mail</label
              >
              <input
                id="email"
                type="email"
                class="w-full p-2 rounded-lg border border-lumi-300 dark:border-lumi-600 bg-white dark:bg-lumi-900/30 text-lumi-900 dark:text-lumi-50 outline-none focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500"
                placeholder="seuemail@exemplo.com"
              />
            </div>
            <div>
              <label
                class="block text-sm mb-1 text-lumi-700 dark:text-lumi-300"
                for="password"
                >Senha</label
              >
              <input
                id="password"
                type="password"
                class="w-full p-2 rounded-lg border border-lumi-300 dark:border-lumi-600 bg-white dark:bg-lumi-900/30 text-lumi-900 dark:text-lumi-50 outline-none focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500"
                placeholder="Crie uma senha"
              />
            </div>
            <button type="submit" class="btn-primary w-full">
              <span>Cadastrar</span>
            </button>
          </form>

          <p class="text-sm mt-6 text-center text-lumi-700 dark:text-lumi-400">
            Já tem conta?
            <a class="underline hover:text-lumi-300" href="../login/">Entrar</a>
          </p>
        </div>
      </section>
    </main>

    <script>
      const root = document.documentElement;
      const toggle = document.getElementById("modeToggle");
      const label = document.getElementById("modeLabel");
      const PREF_KEY = "lumin-theme";
      function applyTheme(theme) {
        if (theme === "dark") root.classList.add("dark");
        else root.classList.remove("dark");
        if (label)
          label.textContent = root.classList.contains("dark")
            ? "Dark"
            : "Light";
      }
      const stored =
        localStorage.getItem(PREF_KEY) ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");
      applyTheme(stored);
      toggle?.addEventListener("click", () => {
        const next = root.classList.contains("dark") ? "light" : "dark";
        localStorage.setItem(PREF_KEY, next);
        applyTheme(next);
      });
    </script>
  </body>
</html>
