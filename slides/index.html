<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumin | Slides</title>
    <meta name="description" content="Apresentação do Lumin" />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="../assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/favicon/favicon.svg"
    />
    <link rel="shortcut icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Lumin" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../icon-animation.css" />
    <script type="module" src="../js/theme-provider.js"></script>
  </head>
  <body
    class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-sky-400/20"
  >
    <!-- Área do slide (conteúdo é injetado via JS) -->
    <main class="relative min-h-screen flex items-center justify-center">
      <div id="slide" class="w-full max-w-5xl px-6 py-16"></div>

      <!-- Botão anterior -->
      <button
        id="prevBtn"
        aria-label="Slide anterior"
        class="group fixed left-6 top-1/2 -translate-y-1/2 flex h-14 w-14 items-center justify-center rounded-full border border-slate-700 bg-slate-900/80 text-slate-200 backdrop-blur hover:bg-slate-800 hover:border-slate-600 focus:outline-none focus:ring-2 focus:ring-sky-500 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          class="transition-transform group-active:-translate-x-0.5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M15 18l-6-6 6-6"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
      </button>

      <!-- Botão próximo -->
      <button
        id="nextBtn"
        aria-label="Próximo slide"
        class="group fixed right-6 top-1/2 -translate-y-1/2 flex h-14 w-14 items-center justify-center rounded-full border border-slate-700 bg-slate-900/80 text-slate-200 backdrop-blur hover:bg-slate-800 hover:border-slate-600 focus:outline-none focus:ring-2 focus:ring-sky-500 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          class="transition-transform group-active:translate-x-0.5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M9 6l6 6-6 6"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
      </button>
    </main>

    <!-- Slides logic -->
    <script type="module" src="../slides/functions/slides.js"></script>
  </body>
</html>
