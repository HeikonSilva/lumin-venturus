<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumin — Login</title>
    <meta name="description" content="Organize, Aprenda & Evolua" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://heikonsilva.github.io/lumin-venturus/"
    />
    <meta property="og:title" content="Lumin" />
    <meta property="og:description" content="Organize, Aprenda & Evolua" />
    <meta property="og:image" content="../assets/meta.png" />
    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://heikonsilva.github.io/lumin-venturus/"
    />
    <meta property="twitter:title" content="Lumin" />
    <meta property="twitter:description" content="Organize, Aprenda & Evolua" />
    <meta property="twitter:image" content="../assets/meta.png" />
    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="../assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/favicon/favicon.svg"
    />
    <link rel="shortcut icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Lumin" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="../services/supabase.js"></script>
    <script type="module" src="../js/auth-handler.js"></script>
    <script type="module" src="../login/functions/login-anonymus.js"></script>
    <script
      type="module"
      src="../login/functions/login-with-google.js"
    ></script>
    <script
      type="module"
      src="../login/functions/login-with-password.js"
    ></script>
  </head>
  <body
    class="min-h-screen bg-lumi-100 dark:bg-lumi-950 text-lumi-800 dark:text-lumi-100 selection:bg-lumi-400/30 selection:text-lumi-50 antialiased"
  >
    <nav class="fixed top-4 left-4 right-4 max-w-3xl mx-auto z-50">
      <div
        class="lumi-border glass-nav px-4 h-12 flex items-center justify-between"
      >
        <a data-route="/" class="flex items-center gap-2">
          <img src="../assets/lumi.svg" alt="Lumin" class="w-7 h-7" />
          <span class="font-semibold text-lumi-400">Lumin</span>
        </a>
        <div class="hidden md:flex items-center gap-4 text-sm" id="desktopMenu">
          <a data-route="/features/" class="hover:text-lumi-300">Produtos</a>
          <a data-route="/about-us/" class="hover:text-lumi-300">Sobre</a>
          <a data-route="/contact-us/" class="hover:text-lumi-300">Contato</a>
          <a data-route="/login/" class="btn-ghost">Entrar</a>
          <a data-route="/register/" class="btn-ghost">Cadastrar</a>
          <button id="modeToggle" aria-label="Alternar tema" class="btn-ghost">
            <span id="modeLabel">Dark</span>
          </button>
        </div>
        <button id="menuToggle" class="btn-ghost backdrop-blur-3xl md:hidden">
          Menu
        </button>
      </div>
      <div
        id="mobileMenu"
        class="hidden md:hidden mt-2 lumi-border p-3 backdrop-blur-3xl"
      >
        <div class="grid gap-2 text-sm">
          <a data-route="/features/" class="hover:text-lumi-300">Produtos</a>
          <a data-route="/about-us/" class="hover:text-lumi-300">Sobre</a>
          <a data-route="/contact-us/" class="hover:text-lumi-300">Contato</a>
          <a data-route="/login/" class="btn-ghost">Entrar</a>
          <a data-route="/register/" class="btn-ghost">Cadastrar</a>
        </div>
      </div>
    </nav>

    <main class="px-4 sm:px-6 pt-24 sm:pt-28 pb-10">
      <section class="max-w-xl mx-auto">
        <div class="lumi-border p-6 sm:p-8 md:p-10">
          <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold">Entrar</h1>
          <p class="mt-3 text-lumi-700 dark:text-lumi-400">
            Acesse sua conta para continuar organizando e evoluindo.
          </p>

          <form
            name="loginForm"
            class="mt-6 space-y-4"
            onsubmit="return false;"
            autocomplete="on"
          >
            <div>
              <label
                for="email"
                class="block text-sm mb-1 text-lumi-700 dark:text-lumi-300"
                >Email</label
              >
              <input
                id="email"
                type="email"
                class="w-full p-2 rounded-lg border border-lumi-300 dark:border-lumi-600 bg-white/70 dark:bg-lumi-900/30 text-lumi-900 dark:text-lumi-50 outline-none focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500"
                placeholder="Seu Email"
                name="email"
                required
              />
            </div>
            <div>
              <label
                class="block text-sm mb-1 text-lumi-700 dark:text-lumi-300"
                for="password"
                >Senha</label
              >
              <input
                id="password"
                type="password"
                class="w-full p-2 rounded-lg border border-lumi-300 dark:border-lumi-600 bg-white dark:bg-lumi-900/30 text-lumi-900 dark:text-lumi-50 outline-none focus:border-lumi-400 placeholder:text-lumi-400 dark:placeholder:text-lumi-500"
                placeholder="Crie uma senha"
                name="password"
                required
                minlength="6"
              />
              <div class="mt-2 text-right">
                <a
                  href="#"
                  id="forgotPwd"
                  class="text-sm underline hover:text-lumi-300"
                  >Esqueci minha senha</a
                >
              </div>
              <p
                id="loginError"
                role="alert"
                aria-live="polite"
                class="mt-2 text-sm text-red-400 hidden"
              ></p>
            </div>
            <button type="submit" class="btn-primary w-full">
              <span>Entrar</span>
            </button>
          </form>

          <div class="mt-6 flex items-center gap-3">
            <div class="h-px bg-lumi-700/40 dark:bg-white/10 flex-1"></div>
            <span class="text-xs text-lumi-600 dark:text-lumi-400">ou</span>
            <div class="h-px bg-lumi-700/40 dark:bg-white/10 flex-1"></div>
          </div>

          <div class="mt-4 flex justify-center gap-2">
            <button
              id="login-google"
              aria-label="Entrar com Google"
              class="btn-social w-11 h-11"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 48 48"
                class="w-5 h-5"
              >
                <path
                  fill="#FFC107"
                  d="M43.611 20.083H42V20H24v8h11.303C33.731 32.91 29.267 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.156 7.961 3.039l5.657-5.657C34.869 6.053 29.706 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.651-.389-3.917z"
                />
                <path
                  fill="#FF3D00"
                  d="M6.306 14.691l6.571 4.817C14.655 16.265 18.961 14 24 14c3.059 0 5.842 1.156 7.961 3.039l5.657-5.657C34.869 6.053 29.706 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"
                />
                <path
                  fill="#4CAF50"
                  d="M24 44c5.207 0 9.9-1.99 13.426-5.228l-6.197-5.238C29.143 35.091 26.715 36 24 36c-5.243 0-9.718-3.106-11.289-7.436l-6.54 5.036C9.49 39.556 16.227 44 24 44z"
                />
                <path
                  fill="#1976D2"
                  d="M43.611 20.083H42V20H24v8h11.303c-1.009 2.823-2.941 5.176-5.497 6.881.002-.001.003-.002.005-.004l6.197 5.238C34.054 42.115 38.5 44 44 44c0-6.627 0-13.255 0-20 0-1.341-.138-2.651-.389-3.917z"
                />
              </svg>
            </button>
            <button
              id="login-guest"
              aria-label="Entrar como convidado"
              class="btn-social w-32 h-11"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
                />
              </svg>
              <span>Convidado</span>
            </button>
          </div>
          <p class="text-sm mt-6 text-center text-lumi-700 dark:text-lumi-400">
            Não tem conta?
            <a class="underline hover:text-lumi-300" href="../register/"
              >Crie uma agora</a
            >
          </p>
        </div>
      </section>
    </main>

    <script type="module" src="../js/theme-provider.js"></script>
    <script type="module" src="../js/nav.js"></script>
    <script type="module" src="./functions/reset-password.js"></script>
    <script type="module">
      import { setupResetPassword } from "./functions/reset-password.js";
      setupResetPassword();
    </script>
  </body>
</html>
