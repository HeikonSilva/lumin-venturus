    <!-- Tailwind CSS -->

    <style type="text/tailwindcss">
      @theme {
        --color-coffee-50: oklch(0.985 0.008 70);
        --color-coffee-100: oklch(0.945 0.015 70);
        --color-coffee-200: oklch(0.875 0.02 70);
        --color-coffee-300: oklch(0.775 0.03 60);
        --color-coffee-400: oklch(0.675 0.04 50);
        --color-coffee-500: oklch(0.575 0.045 50);
        --color-coffee-600: oklch(0.475 0.045 50);
        --color-coffee-700: oklch(0.375 0.04 50);
        --color-coffee-800: oklch(0.275 0.03 40);
        --color-coffee-900: oklch(0.2 0.025 40);
        --color-coffee-950: oklch(0.14 0.02 40);
      }
    </style>
    <style>
      :root {
        --color-coffee-50: oklch(0.985 0.008 70);
        --color-coffee-100: oklch(0.945 0.015 70);
        --color-coffee-200: oklch(0.875 0.02 70);
        --color-coffee-300: oklch(0.775 0.03 60);
        --color-coffee-400: oklch(0.675 0.04 50);
        --color-coffee-500: oklch(0.575 0.045 50);
        --color-coffee-600: oklch(0.475 0.045 50);
        --color-coffee-700: oklch(0.375 0.04 50);
        --color-coffee-800: oklch(0.275 0.03 40);
        --color-coffee-900: oklch(0.2 0.025 40);
        --color-coffee-950: oklch(0.14 0.02 40);
        --radius-base: 18px;
      }
      .lumi-border {
        position: relative;
        border-radius: var(--radius-base);
        background: linear-gradient(
          145deg,
          color-mix(in oklab, var(--color-coffee-800) 96%, black 5%) 0%,
          var(--color-coffee-900) 100%
        );
        border: 1px solid
          color-mix(in oklab, var(--color-coffee-300) 40%, transparent);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset,
          0 0 12px -2px rgba(255, 255, 255, 0.08),
          0 8px 24px -4px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      .lumi-border:before {
        content: "";
        position: absolute;
        inset: 0;
        padding: 1px;
        border-radius: inherit;
        background: radial-gradient(
            circle at 20% 15%,
            rgba(255, 255, 255, 0.18),
            transparent 60%
          ),
          linear-gradient(
            120deg,
            rgba(255, 255, 255, 0.25),
            rgba(255, 255, 255, 0) 60%
          ),
          linear-gradient(
            160deg,
            rgba(203, 170, 150, 0.35),
            rgba(203, 170, 150, 0) 70%
          );
        -webkit-mask: linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        mix-blend-mode: plus-lighter;
      }
      html:not(.dark) .lumi-border:not([data-variant="dark"]) {
        background: linear-gradient(
          145deg,
          var(--color-coffee-50),
          var(--color-coffee-100)
        );
        border-color: color-mix(
          in oklab,
          var(--color-coffee-400) 35%,
          transparent
        );
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.04) inset,
          0 4px 14px -4px rgba(120, 80, 50, 0.18),
          0 0 24px -6px rgba(160, 120, 90, 0.25);
      }
      html:not(.dark) .lumi-border:not([data-variant="dark"]):before {
        background: radial-gradient(
            circle at 25% 20%,
            rgba(160, 120, 90, 0.35),
            transparent 60%
          ),
          linear-gradient(
            120deg,
            rgba(255, 255, 255, 0.65),
            rgba(255, 255, 255, 0) 60%
          ),
          linear-gradient(
            160deg,
            rgba(200, 170, 150, 0.55),
            rgba(200, 170, 150, 0) 70%
          );
        mix-blend-mode: normal;
      }
      .btn-primary {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        border-radius: var(--radius-base);
        overflow: hidden;
        color: var(--color-coffee-50);
        font-size: 0.95rem;
      }
      .btn-primary:before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          var(--color-coffee-500),
          var(--color-coffee-600)
        );
        opacity: 0.9;
      }
      .btn-primary:after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 30% 20%,
          rgba(255, 255, 255, 0.35),
          transparent 60%
        );
        mix-blend-mode: overlay;
      }
      .btn-primary span {
        position: relative;
        z-index: 10;
      }
      .btn-primary:hover:before {
        filter: brightness(1.05);
      }
      .btn-primary:active:before {
        filter: brightness(0.9);
      }
      .btn-ghost {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.9rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        border-radius: var(--radius-base);
        color: var(--color-coffee-200);
        font-size: 0.85rem;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px) saturate(160%);
        -webkit-backdrop-filter: blur(12px) saturate(160%);
      }
      .btn-ghost:hover {
        border-color: rgba(255, 255, 255, 0.3);
        color: var(--color-coffee-50);
      }
      html:not(.dark) .btn-ghost {
        color: var(--color-coffee-700);
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(0, 0, 0, 0.07);
      }
      html:not(.dark) .btn-ghost:hover {
        background: rgba(255, 255, 255, 0.85);
      }
      .glass-nav {
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
      }
      body:before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: radial-gradient(
            circle at 35% 25%,
            var(--color-coffee-300) 10%,
            transparent 55%
          ),
          radial-gradient(
            circle at 75% 70%,
            var(--color-coffee-500) 8%,
            transparent 55%
          ),
          linear-gradient(
            180deg,
            var(--color-coffee-950),
            var(--color-coffee-900)
          );
        opacity: 0.12;
        pointer-events: none;
      }
      html:not(.dark) body {
        background: var(--color-coffee-50);
        color: var(--color-coffee-800);
      }
      html:not(.dark) body:before {
        opacity: 0.25;
        background: radial-gradient(
            circle at 30% 25%,
            var(--color-coffee-200) 10%,
            transparent 55%
          ),
          radial-gradient(
            circle at 80% 65%,
            var(--color-coffee-300) 8%,
            transparent 55%
          ),
          linear-gradient(
            180deg,
            var(--color-coffee-50),
            var(--color-coffee-100)
          );
      }
    </style>

  <body
    class="min-h-screen bg-coffee-100 dark:bg-coffee-950 text-coffee-800 dark:text-coffee-100 selection:bg-coffee-400/30 selection:text-coffee-50 antialiased"
  >
    <nav class="fixed top-4 left-4 right-4 max-w-3xl mx-auto z-50">
      <div
        class="lumi-border glass-nav flex items-center justify-between px-4 h-12"
      >
        <a href="../" class="flex items-center gap-2">
          <img src="../assets/lumi.svg" alt="Lumin" class="w-7 h-7" />
          <span class="font-semibold text-coffee-400">Lumin</span>
        </a>
        <div class="flex items-center gap-2">
          <a href="../register/" class="btn-ghost">Cadastrar</a>
          <button id="modeToggle" aria-label="Alternar tema" class="btn-ghost">
            <span id="modeLabel">Dark</span>
          </button>
        </div>
      </div>
    </nav>

    <main class="px-4 sm:px-6 pt-24 sm:pt-28 pb-10">
      <section class="max-w-xl mx-auto">
        <div class="lumi-border p-6 sm:p-8 md:p-10">
          <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold">Entrar</h1>
          <p class="mt-3 text-coffee-700 dark:text-coffee-400">
            Acesse sua conta para continuar organizando e evoluindo.
          </p>

          <form
            name="magic-link"
            class="mt-6 space-y-4"
            onsubmit="return false;"
            autocomplete="on"
          >
            <div>
              <label
                for="email"
                class="block text-sm mb-1 text-coffee-700 dark:text-coffee-300"
                >Email</label
              >
              <input
                id="email"
                type="email"
                class="w-full p-2 rounded-lg border border-coffee-300 dark:border-coffee-600 bg-white/70 dark:bg-coffee-900/30 text-coffee-900 dark:text-coffee-50 outline-none focus:border-coffee-400 placeholder:text-coffee-400 dark:placeholder:text-coffee-500"
                placeholder="Seu Email"
              />
            </div>
            <button type="submit" class="btn-primary w-full">
              <span>Entrar</span>
            </button>
          </form>

          <div class="mt-6 flex items-center gap-3">
            <div class="h-px bg-coffee-700/40 dark:bg-white/10 flex-1"></div>
            <span class="text-xs text-coffee-600 dark:text-coffee-400">ou</span>
            <div class="h-px bg-coffee-700/40 dark:bg-white/10 flex-1"></div>
          </div>

          <div class="mt-4 flex justify-center gap-2">
            <button
              id="login-google"
              aria-label="Entrar com Google"
              class="inline-flex items-center justify-center w-11 h-11 rounded-full border border-coffee-300 dark:border-coffee-600 bg-white dark:bg-coffee-900 hover:bg-coffee-50 dark:hover:bg-coffee-800 transition"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 48 48"
                class="w-5 h-5"
              >
                <path
                  fill="#FFC107"
                  d="M43.611 20.083H42V20H24v8h11.303C33.731 32.91 29.267 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.156 7.961 3.039l5.657-5.657C34.869 6.053 29.706 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.651-.389-3.917z"
                />
                <path
                  fill="#FF3D00"
                  d="M6.306 14.691l6.571 4.817C14.655 16.265 18.961 14 24 14c3.059 0 5.842 1.156 7.961 3.039l5.657-5.657C34.869 6.053 29.706 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"
                />
                <path
                  fill="#4CAF50"
                  d="M24 44c5.207 0 9.9-1.99 13.426-5.228l-6.197-5.238C29.143 35.091 26.715 36 24 36c-5.243 0-9.718-3.106-11.289-7.436l-6.54 5.036C9.49 39.556 16.227 44 24 44z"
                />
                <path
                  fill="#1976D2"
                  d="M43.611 20.083H42V20H24v8h11.303c-1.009 2.823-2.941 5.176-5.497 6.881.002-.001.003-.002.005-.004l6.197 5.238C34.054 42.115 38.5 44 44 44c0-6.627 0-13.255 0-20 0-1.341-.138-2.651-.389-3.917z"
                />
              </svg>
            </button>
            <button
              id="login-guest"
              aria-label="Entrar como convidado"
              class="inline-flex items-center justify-center w-32 h-11 rounded-full border border-coffee-300 dark:border-coffee-600 bg-white dark:bg-coffee-900 hover:bg-coffee-50 dark:hover:bg-coffee-800 transition"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
                />
              </svg>
              <span>Convidado</span>
            </button>
          </div>
          <p
            class="text-sm mt-6 text-center text-coffee-700 dark:text-coffee-400"
          >
            Não tem conta?
            <a class="underline hover:text-coffee-300" href="../register/"
              >Crie uma agora</a
            >
          </p>
        </div>
      </section>
    </main>

    <script>
      const root = document.documentElement;
      const toggle = document.getElementById("modeToggle");
      const label = document.getElementById("modeLabel");
      const PREF_KEY = "lumin-theme";
      function applyTheme(theme) {
        if (theme === "dark") root.classList.add("dark");
        else root.classList.remove("dark");
        if (label)
          label.textContent = root.classList.contains("dark")
            ? "Dark"
            : "Light";
      }
      const stored =
        localStorage.getItem(PREF_KEY) ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");
      applyTheme(stored);
      toggle?.addEventListener("click", () => {
        const next = root.classList.contains("dark") ? "light" : "dark";
        localStorage.setItem(PREF_KEY, next);
        applyTheme(next);
      });
    </script>
  </body>
