<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumin</title>
    <meta name="description" content="Organize, Aprenda & Evolua" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://heikonsilva.github.io/lumin-venturus/"
    />
    <meta property="og:title" content="Lumin" />
    <meta property="og:description" content="Organize, Aprenda & Evolua" />
    <meta property="og:image" content="../assets/meta.png" />
    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://heikonsilva.github.io/lumin-venturus/"
    />
    <meta property="twitter:title" content="Lumin" />
    <meta property="twitter:description" content="Organize, Aprenda & Evolua" />
    <meta property="twitter:image" content="../assets/meta.png" />
    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="../assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/favicon/favicon.svg"
    />
    <link rel="shortcut icon" href="../assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Lumin" />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-coffee-50: oklch(0.985 0.008 70);
        --color-coffee-100: oklch(0.945 0.015 70);
        --color-coffee-200: oklch(0.875 0.02 70);
        --color-coffee-300: oklch(0.775 0.03 60);
        --color-coffee-400: oklch(0.675 0.04 50);
        --color-coffee-500: oklch(0.575 0.045 50);
        --color-coffee-600: oklch(0.475 0.045 50);
        --color-coffee-700: oklch(0.375 0.04 50);
        --color-coffee-800: oklch(0.275 0.03 40);
        --color-coffee-900: oklch(0.2 0.025 40);
        --color-coffee-950: oklch(0.14 0.02 40);
      }
    </style>
    <script type="module" src="../services/firebase.js"></script>
    <script type="module" src="../js/auth-handler.js"></script>
    <script type="module" src="./functions/login-with-google.js"></script>
  </head>
  <body class="bg-coffee-800 min-h-screen flex items-center justify-center">
    <div
      class="w-2/5 lumi-border bg-coffee-700 border-2 rounded-[18px] p-4 border-coffee-600 flex flex-col gap-2"
    >
      <h1 class="text-4xl font-bold text-coffee-200">Login</h1>
      <div class="space-y-2">
        <label class="text-coffee-200" for="username">Username</label>
        <input
          type="text"
          id="username"
          class="w-full p-2 border border-coffee-600 rounded-[12px] outline-none focus:border-coffee-400"
        />
      </div>
      <div class="space-y-2">
        <label class="text-coffee-200" for="password">Password</label>
        <input
          type="password"
          id="password"
          class="w-full p-2 border border-coffee-600 rounded-[12px] outline-none focus:border-coffee-400"
        />
      </div>
      <div class="flex items-center justify-between">
        <div class="w-1/3 border-2 border-coffee-300 rounded-full"></div>
        <span class="text-coffee-200">Or login with</span>
        <div class="w-1/3 border-2 border-coffee-300 rounded-full"></div>
      </div>
      <div>
        <button
          id="login-google"
          class="w-full p-2 border border-coffee-600 rounded-[12px] bg-coffee-500 hover:bg-coffee-600 transition-colors text-white font-semibold"
        >
          Google
        </button>
      </div>
    </div>
  </body>
</html>
